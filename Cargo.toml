[package]
name = "montazny-navod"
version = "0.1.0"
edition = "2021"
description = "Plugin Montážny návod pre Open CAD Studio."
license = "GPL-3.0-only"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Official Open CAD Studio plugin contract.
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", features = ["host"] }

# Must match OpenCADStudio 2026.43 codec pin exactly.
acadrust = { package = "acadrust", git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "24b037a" }
