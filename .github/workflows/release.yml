name: release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "plugin.toml"
      - "src/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/*.dll "dist/sk.montazny.navod-windows-x86_64.dll"
          acadrust_source=$(grep -A3 '^name = "acadrust"' Cargo.lock | grep '^source' | head -1 | sed 's/^source = "//;s/"$//')
          if [ -z "$acadrust_source" ]; then
            acadrust_source=$(grep -A3 '^name = "opencadcodec"' Cargo.lock | grep '^source' | head -1 | sed 's/^source = "//;s/"$//')
          fi
          sed \
            -e "s|__RUSTC_VERSION__|$(rustc --version)|" \
            -e "s|__ACADRUST_SOURCE__|$acadrust_source|" \
            plugin.toml > dist/plugin.toml

      - name: Publish v0.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Montážny návod v0.1.0
          target_commitish: main
          files: |
            dist/sk.montazny.navod-windows-x86_64.dll
            dist/plugin.toml
