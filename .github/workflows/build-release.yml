name: build-and-release-v0.3.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build plugin
        shell: pwsh
        run: |
          cargo build --release
          if (-not (Test-Path "target/release/montazny_navod.dll")) { throw "montazny_navod.dll was not produced" }

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/montazny_navod.dll" "dist/sk.montazny.navod-windows-x86_64.dll"
          Copy-Item "plugin.toml" "dist/plugin.toml"

      - name: Create or update GitHub Release v0.3.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.3.0 "dist/sk.montazny.navod-windows-x86_64.dll" "dist/plugin.toml" --title "Montážny návod v0.3.0" --notes "Montážne kroky, XDATA a SVG export pre Affinity." --target main
          } else {
            gh release upload v0.3.0 "dist/sk.montazny.navod-windows-x86_64.dll" "dist/plugin.toml" --clobber
          }
