[plugin]
id = "sk.montazny.navod"
name = "Montážny návod"
version = "0.1.0"
description = "Plugin Montážny návod pre Open CAD Studio."
author = "Martin"
license = "GPL-3.0-only"
repository = "martindrabdrab-sketch/demont"

[opencad]
api_version = 13
rustc_version = "__RUSTC_VERSION__"
acadrust_source = "__ACADRUST_SOURCE__"
ribbon_order = 20
command_prefixes = [
    "MONTAZ_HIDE_SELECTED",
    "MONTAZ_ISOLATE_SELECTED",
    "MONTAZ_SHOW_ALL",
    "MONTAZ_SELECTION_INFO",
]
xdata_apps = []
